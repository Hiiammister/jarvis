[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bella"
version = "0.2.0"
description = "Local personal AI workstation / assistant (Ollama, persistent memory, voice, tools)."
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
bella = "bella.cli_entry:main"

[tool.setuptools]
py-modules = ["jarvis", "server"]

[tool.setuptools.packages.find]
include = ["bella*", "llm*", "memory*", "tools*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
